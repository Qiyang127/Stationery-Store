<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Register - Paper & Pen</title>
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
	<link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>
	<nav class="navbar navbar-expand-lg bg-body-tertiary">
		<div class="container">
			<a class="navbar-brand fw-bold" href="index.html">Paper & Pen</a>
		</div>
	</nav>
	<main class="container py-4">
		<div class="row justify-content-center">
			<div class="col-md-6 col-lg-5">
				<h1 class="h4 mb-3">Create Account</h1>
				<form id="register-form" class="needs-validation" novalidate>
					<div class="mb-3">
						<label class="form-label">Full Name</label>
						<input type="text" name="name" class="form-control" required>
					</div>
					<div class="mb-3">
						<label class="form-label">Email</label>
						<input type="email" name="email" class="form-control" required>
					</div>
					<div class="mb-3">
						<label class="form-label">Password</label>
						<input type="password" name="password" class="form-control" required>
					</div>
					<div class="mb-3">
						<label class="form-label">Confirm Password</label>
						<input type="password" name="confirm_password" class="form-control" required>
					</div>
					<button class="btn btn-primary" type="submit">Register</button>
				</form>
				<div id="register-error" class="alert alert-danger mt-3 d-none">Registration failed</div>
			</div>
		</div>
	</main>
	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
	<script src="assets/js/store.js"></script>
	<script>window.PnP.renderRegister();</script>
</body>
</html>
